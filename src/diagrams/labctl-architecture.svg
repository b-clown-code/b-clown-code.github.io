<svg class="diagram-svg" viewBox="0 0 760 400" role="img" aria-labelledby="t-labctl-architecture" xmlns="http://www.w3.org/2000/svg"><title id="t-labctl-architecture">labctl architecture: the owner talks to a Director, which directs one Lead per project, each running Tracks; a daemon with no model calls reads a SQLite event log and dispatches wakes; each wake gets a fresh briefing; results settle back; GPU access only through gpuq</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker></defs><rect class="box" x="10" y="20" width="110" height="44" rx="6"/><text x="65.0" y="47.0" text-anchor="middle">Owner</text><rect class="box" x="190" y="20" width="140" height="44" rx="6"/><text x="260.0" y="47.0" text-anchor="middle">Director</text><path class="arrow" d="M120 36 L190 36" marker-end="url(#a)"/><path class="arrow" d="M190 50 L120 50" marker-end="url(#a)"/><rect class="box" x="10" y="120" width="150" height="44" rx="6"/><text x="85.0" y="147.0" text-anchor="middle">Lead: project A</text><path class="arrow" d="M260 64 L260 92 L85 92 L85 120" marker-end="url(#a)"/><rect class="box" x="175" y="120" width="150" height="44" rx="6"/><text x="250.0" y="147.0" text-anchor="middle">Lead: project B</text><path class="arrow" d="M260 64 L260 92 L250 92 L250 120" marker-end="url(#a)"/><rect class="box" x="340" y="120" width="150" height="44" rx="6"/><text x="415.0" y="147.0" text-anchor="middle">Lead: project C</text><path class="arrow" d="M260 64 L260 92 L415 92 L415 120" marker-end="url(#a)"/><rect class="box side" x="10" y="215" width="150" height="40" rx="6"/><text x="85.0" y="240.0" text-anchor="middle">Tracks</text><path class="arrow" d="M85 164 L85 215" marker-end="url(#a)"/><rect class="box side" x="175" y="215" width="150" height="40" rx="6"/><text x="250.0" y="240.0" text-anchor="middle">Tracks</text><path class="arrow" d="M250 164 L250 215" marker-end="url(#a)"/><rect class="box side" x="340" y="215" width="150" height="40" rx="6"/><text x="415.0" y="240.0" text-anchor="middle">Tracks</text><path class="arrow" d="M415 164 L415 215" marker-end="url(#a)"/><rect class="box hi" x="540" y="20" width="200" height="90" rx="6"/><text x="640.0" y="54.0" text-anchor="middle">Daemon</text><text x="640.0" y="70.0" text-anchor="middle">(no model calls)</text><text x="640.0" y="86.0" text-anchor="middle">dispatches wakes</text><rect class="box" x="540" y="160" width="200" height="50" rx="6"/><text x="640.0" y="182.0" text-anchor="middle">SQLite event log</text><text x="640.0" y="198.0" text-anchor="middle">(durable state)</text><path class="arrow" d="M640 160 L640 110" marker-end="url(#a)"/><text class="small" x="668" y="140" text-anchor="middle">reads</text><path class="arrow dash" d="M540 65 L340 65 L340 85 L260 85" marker-end="url(#a)"/><text class="small" x="445" y="59" text-anchor="middle">wake + fresh briefing</text><path class="arrow dash" d="M490 235 L515 235 L515 195 L540 195" marker-end="url(#a)"/><text class="small" x="625" y="245" text-anchor="middle">results settle back</text><rect class="box warn" x="190" y="320" width="380" height="44" rx="6"/><text x="380.0" y="347.0" text-anchor="middle">GPU access only via gpuq</text><path class="arrow" d="M85 255 L85 292 L380 292 L380 320" marker-end="url(#a)"/></svg>