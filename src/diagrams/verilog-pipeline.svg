<svg class="diagram-svg" viewBox="0 0 760 250" role="img" aria-labelledby="t-verilog-pipeline" xmlns="http://www.w3.org/2000/svg"><title id="t-verilog-pipeline">Verilog testbench pipeline: designs, validation and selection, LLM testbench generation, Icarus compile and simulate, waveform and dataset QA, LoRA training and export, held-out evaluation</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker></defs><rect class="box" x="10" y="30" width="100" height="56" rx="6"/><text x="60.0" y="63.0" text-anchor="middle">Designs</text><rect class="box" x="135" y="30" width="100" height="56" rx="6"/><text x="185.0" y="55.0" text-anchor="middle">Validate /</text><text x="185.0" y="71.0" text-anchor="middle">select</text><rect class="box" x="260" y="30" width="100" height="56" rx="6"/><text x="310.0" y="55.0" text-anchor="middle">LLM writes</text><text x="310.0" y="71.0" text-anchor="middle">testbench</text><rect class="box hi" x="385" y="30" width="100" height="56" rx="6"/><text x="435.0" y="55.0" text-anchor="middle">Icarus compile</text><text x="435.0" y="71.0" text-anchor="middle">+ simulate</text><rect class="box" x="72" y="150" width="100" height="56" rx="6"/><text x="122.0" y="175.0" text-anchor="middle">Waveform +</text><text x="122.0" y="191.0" text-anchor="middle">dataset QA</text><rect class="box" x="197" y="150" width="100" height="56" rx="6"/><text x="247.0" y="175.0" text-anchor="middle">LoRA training</text><text x="247.0" y="191.0" text-anchor="middle">+ export</text><rect class="box" x="322" y="150" width="100" height="56" rx="6"/><text x="372.0" y="175.0" text-anchor="middle">Held-out</text><text x="372.0" y="191.0" text-anchor="middle">evaluation</text><path class="arrow" d="M110 58.0 L135 58.0" marker-end="url(#a)"/><path class="arrow" d="M235 58.0 L260 58.0" marker-end="url(#a)"/><path class="arrow" d="M360 58.0 L385 58.0" marker-end="url(#a)"/><path class="arrow" d="M435.0 86 L435.0 110 L122.0 110 L122.0 150" marker-end="url(#a)"/><path class="arrow" d="M172 178.0 L197 178.0" marker-end="url(#a)"/><path class="arrow" d="M297 178.0 L322 178.0" marker-end="url(#a)"/><text class="small" x="380" y="232" text-anchor="middle">Only testbenches that compile and simulate are kept for training</text></svg>