<svg class="diagram-svg" viewBox="0 0 760 380" role="img" aria-labelledby="t-gpuq-states" xmlns="http://www.w3.org/2000/svg"><title id="t-gpuq-states">gpuq job states: PENDING_REVIEW, PENDING_APPROVAL, QUEUED, STARTING, RUNNING, then COMPLETED, FAILED, TIMED_OUT, CANCELLED or INTERRUPTED; HELD and BLOCKED side states; INTERRUPTED auto-requeues, maximum 3 times</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker></defs><rect class="box" x="10" y="20" width="130" height="40" rx="6"/><text x="75.0" y="45.0" text-anchor="middle">PENDING_REVIEW</text><rect class="box" x="160" y="20" width="140" height="40" rx="6"/><text x="230.0" y="45.0" text-anchor="middle">PENDING_APPROVAL</text><rect class="box" x="310" y="20" width="110" height="40" rx="6"/><text x="365.0" y="45.0" text-anchor="middle">QUEUED</text><rect class="box" x="450" y="20" width="110" height="40" rx="6"/><text x="505.0" y="45.0" text-anchor="middle">STARTING</text><rect class="box hi" x="590" y="20" width="110" height="40" rx="6"/><text x="645.0" y="45.0" text-anchor="middle">RUNNING</text><path class="arrow" d="M140 40 L160 40" marker-end="url(#a)"/><path class="arrow" d="M300 40 L310 40" marker-end="url(#a)"/><path class="arrow" d="M420 40 L450 40" marker-end="url(#a)"/><path class="arrow" d="M560 40 L590 40" marker-end="url(#a)"/><rect class="box" x="10" y="150" width="115" height="40" rx="6"/><text x="67.5" y="175.0" text-anchor="middle">COMPLETED</text><rect class="box" x="160" y="150" width="115" height="40" rx="6"/><text x="217.5" y="175.0" text-anchor="middle">FAILED</text><rect class="box" x="310" y="150" width="115" height="40" rx="6"/><text x="367.5" y="175.0" text-anchor="middle">TIMED_OUT</text><rect class="box" x="450" y="150" width="115" height="40" rx="6"/><text x="507.5" y="175.0" text-anchor="middle">CANCELLED</text><rect class="box warn" x="590" y="150" width="125" height="40" rx="6"/><text x="652.5" y="175.0" text-anchor="middle">INTERRUPTED</text><path class="arrow" d="M645 60 L645 105" marker-end="url(#a)"/><path class="arrow" d="M645 105 L67 105 L67 150" marker-end="url(#a)"/><path class="arrow" d="M217 105 L217 150" marker-end="url(#a)"/><path class="arrow" d="M367 105 L367 150" marker-end="url(#a)"/><path class="arrow" d="M507 105 L507 150" marker-end="url(#a)"/><path class="arrow" d="M652 105 L652 150" marker-end="url(#a)"/><text class="small" x="380" y="98" text-anchor="middle">terminal states</text><path class="arrow dash" d="M652 190 L652 235 L292 235 L292 78 L330 78 L330 60" marker-end="url(#a)"/><text class="small" x="470" y="252" text-anchor="middle">auto-requeue after reboot (max 3)</text><rect class="box side" x="150" y="290" width="110" height="40" rx="6"/><text x="205.0" y="315.0" text-anchor="middle">HELD</text><rect class="box side" x="300" y="290" width="110" height="40" rx="6"/><text x="355.0" y="315.0" text-anchor="middle">BLOCKED</text><text class="small" x="520" y="315" text-anchor="middle">HELD and BLOCKED are side states</text></svg>