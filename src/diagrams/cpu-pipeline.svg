<svg class="diagram-svg" viewBox="0 0 760 300" role="img" aria-labelledby="t-cpu-pipeline" xmlns="http://www.w3.org/2000/svg"><title id="t-cpu-pipeline">5-stage CPU pipeline: IF, ID, EX, MEM, WB with IF/ID, ID/EX, EX/MEM and MEM/WB registers; stall and flush paths; write-back to decode bypass</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker></defs><rect class="box hi" x="10" y="60" width="70" height="50" rx="6"/><text x="45.0" y="90.0" text-anchor="middle">IF</text><rect class="box hi" x="160" y="60" width="70" height="50" rx="6"/><text x="195.0" y="90.0" text-anchor="middle">ID</text><rect class="box hi" x="310" y="60" width="70" height="50" rx="6"/><text x="345.0" y="90.0" text-anchor="middle">EX</text><rect class="box hi" x="460" y="60" width="70" height="50" rx="6"/><text x="495.0" y="90.0" text-anchor="middle">MEM</text><rect class="box hi" x="610" y="60" width="70" height="50" rx="6"/><text x="645.0" y="90.0" text-anchor="middle">WB</text><rect class="reg" x="95" y="50" width="50" height="70" rx="4"/><text class="small" x="120" y="138" text-anchor="middle">IF/ID</text><rect class="reg" x="245" y="50" width="50" height="70" rx="4"/><text class="small" x="270" y="138" text-anchor="middle">ID/EX</text><rect class="reg" x="395" y="50" width="50" height="70" rx="4"/><text class="small" x="420" y="138" text-anchor="middle">EX/MEM</text><rect class="reg" x="545" y="50" width="50" height="70" rx="4"/><text class="small" x="570" y="138" text-anchor="middle">MEM/WB</text><path class="arrow" d="M80 85 L95 85" marker-end="url(#a)"/><path class="arrow" d="M145 85 L160 85" marker-end="url(#a)"/><path class="arrow" d="M230 85 L245 85" marker-end="url(#a)"/><path class="arrow" d="M295 85 L310 85" marker-end="url(#a)"/><path class="arrow" d="M380 85 L395 85" marker-end="url(#a)"/><path class="arrow" d="M445 85 L460 85" marker-end="url(#a)"/><path class="arrow" d="M530 85 L545 85" marker-end="url(#a)"/><path class="arrow" d="M595 85 L610 85" marker-end="url(#a)"/><path class="arrow" d="M645 110 L645 220 L185 220 L185 112" marker-end="url(#a)"/><text class="small" x="415" y="238" text-anchor="middle">write-back bypass (register file to decode)</text><rect class="box warn" x="10" y="180" width="110" height="36" rx="6"/><text x="65.0" y="203.0" text-anchor="middle">Stall</text><path class="arrow dash" d="M65 180 L65 112" marker-end="url(#a)"/><text class="small" x="430" y="20" text-anchor="middle">Flush (on jump / branch) clears the earlier stages</text><path class="arrow dash" d="M350 60 L350 30 L45 30 L45 60" marker-end="url(#a)"/></svg>