- id: cpu-design
  text: "8-bit Harvard CPU, custom 16-bit ISA (14 instructions), 5-stage MIPS-style pipeline with EX/MEM and MEM/WB forwarding of ALU results, a write-back-to-decode register bypass, a load-use stall, and stall/flush on jumps and branches; assembler in C++ and Python"
  source: "github b-clown-code/8-bit-verilog-processor@75f2f79 (README.md, Control.v:306-316 stall, Control.v:352-373 forwarding, Control.v:400-421 ALU mux, Registers.v:57, Assembler.cpp, Pyssembler.py)"
  caveat: "Corrected 2026-11-19: the earlier wording (register-file bypass only, no EX/MEM forwarding) was wrong; forwarding was confirmed in RTL simulation (cpu-hazards)."
  status: verified
  link: "https://github.com/b-clown-code/8-bit-verilog-processor/blob/75f2f7971bfd358b03445c36ee76adcb8b560803/Control.v"
  checked: 2026-11-19

- id: cpu-isa
  text: "Instruction word: funct [15:11], RT [10:8], immediate [7:0], RA [5:3], RB [2:0]. Opcodes: AND 00000, OR 00001, ADD 00010, SUB 00011, SLT 00100, NOR 00101, SETEQUAL 00110, LI 01000, SB 10000, LB 10001, LINK 10010, JUMP 10011, BEQ 10100, DISPLAY 11000. 256 x 16-bit instruction memory (address 0 is padding, programs start at 1), eight 8-bit registers R0-R7 with R0 never written, 256-byte data memory; jump targets are read from data-memory slots 0 to 7"
  source: "github b-clown-code/8-bit-verilog-processor@75f2f79 (README.md, IF_ID.v, Control.v decode block, Instruction_Memory.v, Registers.v, dataMem.v, Pyssembler.py)"
  status: verified
  checked: 2026-11-19

- id: cpu-hazards
  text: "In RTL simulation: forwarding carries ALU results only, so a consumer 1 or 2 instructions after LB reads a stale value; an SB 2 instructions after the instruction that writes its register stores a stale value; when RA = RB, the register-file bypass updates RA only. A taken branch or jump costs 3 cycles, a branch not taken 1, a load-use stall 1"
  source: "scripts/cpu-rtl/programs (load-use, store-after-write, fwd-distances) run on the vendored RTL in Icarus Verilog; content/cpu-rtl-check.json"
  caveat: "Icarus Verilog simulation of the public RTL, not a hardware measurement. The RTL has decode latches and a multiply-driven branch signal, so synthesized behaviour may differ."
  status: verified
  checked: 2026-11-19

- id: cpu-sim-rtl-match
  text: "The browser simulator matches the RTL in Icarus Verilog on 330 of 330 programs (30 directed runs, 300 seeded random programs), 67,830 cycles compared (35 signal values per cycle plus final data memory) with 0 mismatches; its assembler matches Pyssembler.py on 11 of 11 programs; 8 of 8 deliberately planted model bugs were caught"
  source: "scripts/check_cpu.mjs; content/cpu-rtl-check.json"
  caveat: "Matches the RTL as simulated, including its hazards; it does not model the board I/O (switches, buttons, seven-segment display)."
  status: verified
  checked: 2026-11-19

- id: cpu-boards
  text: "Single-cycle version on a Nexys A7 (Artix-7); pipelined and ported to a Real Digital Boolean Board (Spartan-7) with a custom data bus to a display module; string-to-assembly tool"
  source: "owner statement 2026-11-16; previous portfolio (sites.google.com/view/brandon-oldportfolio); public repo Nexys-4-DDR/A7 XDC; local Boolean Board XDC (boolean.xdc)"
  status: verified
