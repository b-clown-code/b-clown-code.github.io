- id: cpu-front-panel
  text: "Single-cycle version (Top.v, created 2024-11-13, last edited 2024-11-26) in switch mode: 16 slide switches hold one instruction, BTNC executes it, three seven-segment digits show DISPLAY output; LINK, JUMP and BEQ not implemented in switch mode. Browser model vs RTL in Icarus Verilog: 18 of 18 programs, 368 button presses, 0 mismatches, including 300 random presses; 3 of 3 planted model bugs caught. The latched instruction re-executes every internal clock (100 MHz / 32): ADD R1, R1, R1 settles at 0, ADD R1, R1, R2 is timing-dependent. 4 challenges; 10 ms debouncer replaced in simulation"
  value: {switches: 16, programs: 18, presses: 368, random_presses: 300, mutations: 3, challenges: 4, digits: 3, divider: 32, debounce_ms: 10}
  source: "owner zip single_cycle_8bit.zip (eight_bit_cpu_single_file: Top.v, readme.txt, Nexys-4-DDR-Master.xdc, BTN = btnc N17); scripts/check_panel_rtl.mjs -> content/cpu-panel-rtl-check.json; owner account 2026-11-19"
  caveat: "Single-cycle source is not public. Simulation shims: debouncer -> one-clock pulse, incomplete sensitivity lists -> @(*), registers start at 0. The stored power-on program is not modelled (its JUMP path is a combinational loop)."
