# ---------------------------------------------------------------- Verification case studies
- id: case-bf16
  text: "Found a silent precision defect: the 135M trainer kept weights and optimizer state in pure BF16; about 40% of model values were bit-identical between two checkpoints, and the Adam second-moment estimate decreased in 0 of 135,031,104 entries. A pre-registered paired test then showed FP32 master weights finished 1.645 nats lower at 100M tokens, better on 5 of 5 validation streams"
  source: "ancient-corpus:docs/RESULTS-REVIEW.md:5; ancient-corpus:research/precision-test-v1/RESULTS.md:3,16"
  caveat: "One seed pair. Results from the old trainer (including Gate 5 curves in the public ancient-text-research repo) are treated as compromised."
  status: verified
  checked: 2026-11-16

- id: case-bf16-streams
  text: "Final validation loss gap, pure BF16 minus FP32 weights with BF16 autocast, by stream (nats): Egyptian 2.291 (66 sequences); Ancient Greek 1.605 (256); Latin canonical 1.502 (150); Latin 170M 1.236 (256); Syriac 1.591 (9). FP32-autocast was better on 5 of 5 streams."
  source: "ancient-corpus:research/precision-test-v1/RESULTS.md:9-15"
  caveat: "Validation streams overlap with training data, so only the paired gap is meaningful, not the absolute losses. One seed pair; Syriac has 9 sequences."
  status: verified
  checked: 2026-11-16

